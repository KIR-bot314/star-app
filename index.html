<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Звёздочки">
<meta name="theme-color" content="#0d0f2b">
<title>Звёздочки</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#ffd76a;
  --gold-hi:#ffe9a8;
  --ink:#fff6e9;
  --dim:rgba(255,246,233,.55);
  --card:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.14);
  --h:255; /* акцентный оттенок текущего ребёнка */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:'Nunito',ui-rounded,'SF Pro Rounded',-apple-system,system-ui,sans-serif;
  color:var(--ink);
  background:#0d0f2b;
  overflow:hidden;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
input,textarea{-webkit-user-select:text;user-select:text}
#bgstars{position:fixed;inset:0;pointer-events:none;z-index:0}
#bgstars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;animation:bgTwinkle 4s ease-in-out infinite}
@keyframes bgTwinkle{0%,100%{opacity:.15}50%{opacity:.6}}
#app{
  position:relative;z-index:1;height:100dvh;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  background:
    radial-gradient(130% 55% at 50% -8%, hsl(var(--h) 60% 34% / .5), transparent 62%),
    linear-gradient(#0d0f2b 0%, #141239 52%, #1a1548 100%);
  transition:background .5s;
}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}

.screen{min-height:100%;max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.boot{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.boot .star-big{font-size:64px;animation:bootPulse 1.1s ease-in-out infinite}
.boot .note{font-size:15px;font-weight:800;color:var(--dim);text-align:center;padding:0 30px;min-height:20px}
@keyframes bootPulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.18);opacity:1}}

/* ---------- дом: выбор профиля ---------- */
.home{justify-content:center;gap:22px;text-align:center}
.home .logo{font-size:56px;filter:drop-shadow(0 0 18px rgba(255,215,106,.55));animation:floaty 5s ease-in-out infinite}
.home h1{margin:0;font-size:34px;font-weight:900;letter-spacing:.5px}
.home .whose{margin:-10px 0 0;font-size:16px;font-weight:800;color:var(--dim)}
.kidgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.kidcard{
  font-family:inherit;color:var(--ink);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:26px 8px 20px;border-radius:30px;
  border:1.5px solid hsl(var(--h) 85% 72% / .5);
  background:linear-gradient(165deg, hsl(var(--h) 72% 56% / .30), hsl(var(--h) 72% 42% / .10));
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  transition:transform .12s;
}
.kidcard:active{transform:scale(.95)}
.kc-av{font-size:52px}
.kc-nm{font-size:24px;font-weight:900}
.kc-bal{font-size:18px;font-weight:800;color:var(--gold-hi)}
.ghost{
  font-family:inherit;margin-top:20px;align-self:center;
  background:none;border:1.5px solid var(--line);color:var(--dim);
  border-radius:100px;padding:10px 20px;font-size:15px;font-weight:700;cursor:pointer;
}
.ghost:active{transform:scale(.96)}

/* ---------- детский экран ---------- */
.kidhead{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:8px}
.back{
  font-family:inherit;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);font-size:24px;line-height:1;cursor:pointer;
}
.back:active{transform:scale(.92)}
.kidtitle{display:flex;align-items:center;justify-content:center;gap:10px}
.avatar{background:none;border:none;font-size:38px;cursor:pointer;padding:2px;font-family:inherit}
.kidname{font-size:26px;font-weight:900}
.wob{animation:wobble .5s}
@keyframes wobble{0%{transform:rotate(0)}25%{transform:rotate(-14deg) scale(1.15)}55%{transform:rotate(12deg) scale(1.15)}100%{transform:rotate(0)}}

.constellation{
  align-self:center;max-width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:9px 16px;text-align:center;
}
.c-label{font-size:13px;font-weight:800;color:var(--dim);margin-bottom:5px}
.c-stars{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:320px}
.c-stars .mini{font-size:11px;color:var(--gold);text-shadow:0 0 6px rgba(255,215,106,.8)}
.c-stars .more{font-size:12px;font-weight:800;color:var(--gold-hi)}
.c-empty{font-size:12px;color:var(--dim)}

.balline{text-align:center;font-size:20px;font-weight:800;margin:14px 0 2px}
.balline b{font-size:30px;font-weight:900;color:var(--gold-hi);text-shadow:0 0 14px rgba(255,215,106,.5)}

#sky{position:relative;height:clamp(260px,42vh,420px);flex-shrink:0}
.star{
  position:absolute;transform:translate(-50%,-50%);cursor:pointer;
  filter:drop-shadow(0 0 8px rgba(255,215,106,.65));
  animation:floaty 4.5s ease-in-out infinite, glimmer 3.2s ease-in-out infinite;
}
@keyframes floaty{0%,100%{margin-top:0}50%{margin-top:-6px}}
@keyframes glimmer{0%,100%{filter:drop-shadow(0 0 5px rgba(255,215,106,.4))}50%{filter:drop-shadow(0 0 14px rgba(255,232,150,.95))}}
.star.pop{animation:starPop .45s}
@keyframes starPop{0%{transform:translate(-50%,-50%) scale(1)}40%{transform:translate(-50%,-50%) scale(1.5) rotate(18deg)}100%{transform:translate(-50%,-50%) scale(1)}}
.sky-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--dim);font-weight:800;text-align:center;padding:0 30px}
.sky-empty .moon{font-size:44px;opacity:.9}

.shelfhead{font-size:15px;font-weight:800;color:var(--dim);margin:14px 4px 8px}
.shelf{display:flex;flex-direction:column;gap:10px}
.rw{
  display:flex;align-items:center;gap:14px;
  background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:13px 16px;
  cursor:pointer;transition:transform .12s;
}
.rw:active{transform:scale(.97)}
.rw.can{
  border-color:hsl(48 100% 72% / .8);
  background:linear-gradient(160deg, rgba(255,215,106,.16), rgba(255,215,106,.05));
  animation:canPulse 2.4s ease-in-out infinite;
}
@keyframes canPulse{0%,100%{box-shadow:0 0 0 rgba(255,215,106,0)}50%{box-shadow:0 0 22px rgba(255,215,106,.35)}}
.rw-em{font-size:38px}
.rw-body{flex:1;min-width:0}
.rw-nm{font-size:17px;font-weight:900;margin-bottom:5px}
.rw-slots{display:flex;flex-wrap:wrap;gap:3px}
.slot{font-size:16px;color:rgba(255,255,255,.22)}
.slot.on{color:var(--gold);text-shadow:0 0 8px rgba(255,215,106,.8)}
.cost-big{font-size:15px;font-weight:800;color:var(--gold-hi)}
.rw-tag{font-size:13px;font-weight:900;white-space:nowrap;color:var(--dim)}
.rw.can .rw-tag{color:var(--gold-hi)}
.rw.wig{animation:wiggle .4s}
@keyframes wiggle{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.rw.req{
  border:2px solid var(--gold);
  background:linear-gradient(160deg, rgba(255,215,106,.24), rgba(255,215,106,.08));
  box-shadow:0 0 24px rgba(255,215,106,.4);
  animation:none;
}
.rw.req .rw-tag{color:var(--gold-hi)}

.reqbox{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,215,106,.14);border:1.5px solid rgba(255,215,106,.55);
  border-radius:16px;padding:10px 12px;margin-bottom:11px;
}
.reqtxt{flex:1;min-width:0;font-size:15px;font-weight:800;line-height:1.35}
.reqtxt b{color:var(--gold-hi)}
.reqbtns{display:flex;gap:7px;flex-shrink:0}
.reqbtns .ok{font-family:inherit;border:none;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:900;background:linear-gradient(160deg,#ffd76a,#ffb143);color:#4a2c00;cursor:pointer}
.reqbtns .no{font-family:inherit;border:1.5px solid var(--line);background:var(--card);color:var(--dim);border-radius:12px;width:40px;padding:10px 0;font-size:15px;cursor:pointer}
.reqbtns .ok:active,.reqbtns .no:active{transform:scale(.94)}

.toast{
  position:fixed;left:50%;bottom:calc(38px + env(safe-area-inset-bottom));transform:translateX(-50%) scale(.8);
  background:linear-gradient(160deg,#ffd76a,#ffb84d);color:#4a2c00;
  font-weight:900;font-size:18px;padding:13px 24px;border-radius:100px;z-index:70;
  box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;
  max-width:calc(100vw - 30px);overflow:hidden;text-overflow:ellipsis;
}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}

/* ---------- PIN ---------- */
.pinscr{align-items:center;justify-content:center;gap:14px;text-align:center}
.pinscr .back{position:absolute;top:calc(14px + env(safe-area-inset-top));left:18px}
.lockemoji{font-size:44px}
.pinscr h2{margin:0;font-size:22px;font-weight:900}
.dots{display:flex;gap:14px;margin:6px 0}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--dim)}
.dot.full{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px rgba(255,215,106,.7)}
.dots.shake{animation:shakeX .35s}
@keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.pinhint{font-size:13px;color:var(--dim);margin:0}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;margin-top:8px}
.key{
  font-family:inherit;width:76px;height:64px;border-radius:20px;font-size:26px;font-weight:800;
  background:var(--card);border:1.5px solid var(--line);color:var(--ink);cursor:pointer;
}
.key:active{transform:scale(.92);background:rgba(255,255,255,.15)}

/* ---------- родительский ---------- */
.phead{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.phead h2{margin:0;font-size:22px;font-weight:900}
.conn{font-size:12px;font-weight:800;color:var(--dim);margin:0 0 14px 56px;min-height:16px}
.conn::before{content:'●';margin-right:5px;color:var(--dim)}
.conn.on::before{color:#9fe38f}
.conn.off::before{color:#ff9d9d}
.pk{
  border-radius:24px;padding:15px 16px;margin-bottom:11px;
  border:1.5px solid hsl(var(--kh) 85% 72% / .45);
  background:linear-gradient(165deg, hsl(var(--kh) 72% 55% / .22), hsl(var(--kh) 72% 42% / .07));
}
.pk-top{display:flex;align-items:baseline;gap:9px;margin-bottom:3px}
.pk-top .em{font-size:26px}
.pk-top .nm{font-size:20px;font-weight:900}
.pk-nums{font-size:16px;font-weight:800;color:var(--gold-hi);margin-bottom:11px}
.pk-nums .sub{color:var(--dim);font-weight:700;font-size:14px}
.pk-btns{display:flex;gap:10px}
.btn{
  font-family:inherit;flex:1;border:none;border-radius:16px;padding:13px 8px;
  font-size:17px;font-weight:900;cursor:pointer;transition:transform .1s;
}
.btn:active{transform:scale(.95)}
.btn.earn{background:linear-gradient(160deg,#ffd76a,#ffb143);color:#4a2c00}
.btn.spend{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.psec{margin-top:20px}
.psec h3{margin:0 0 9px;font-size:15px;font-weight:900;color:var(--dim)}
.rwrow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.rwrow input{
  font-family:inherit;background:var(--card);border:1.5px solid var(--line);color:var(--ink);
  border-radius:13px;padding:11px 10px;font-size:16px;font-weight:700;min-width:0;
}
.rwrow .i-em{width:56px;text-align:center;flex-shrink:0}
.rwrow .i-nm{flex:1}
.rwrow .i-cost{width:64px;text-align:center;flex-shrink:0}
.icon-btn{
  font-family:inherit;width:42px;height:42px;flex-shrink:0;border-radius:13px;
  background:var(--card);border:1.5px solid var(--line);color:var(--dim);font-size:17px;cursor:pointer;
}
.addrow{width:100%;font-size:15px;padding:11px;height:auto}
.seg{display:flex;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{
  font-family:inherit;flex:1;border:none;background:none;color:var(--dim);
  border-radius:12px;padding:10px 4px;font-size:15px;font-weight:800;cursor:pointer;
}
.seg button.on{background:hsl(48 100% 70%);color:#4a2c00}
.seg-note{font-size:12.5px;color:var(--dim);margin-top:7px;line-height:1.45}
.pinrow{display:flex;gap:8px}
.pinrow input{flex:1;font-family:inherit;background:var(--card);border:1.5px solid var(--line);color:var(--ink);border-radius:13px;padding:11px 12px;font-size:16px;font-weight:700;letter-spacing:4px}
.pinrow .btn{flex:0 0 auto;padding:11px 18px}
.hist-item{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid rgba(255,255,255,.07);font-size:15px;font-weight:700}
.hist-item .when{color:var(--dim);font-size:13px;font-weight:700;white-space:nowrap}
.hist-item .plus{color:#9fe38f}
.hist-item .minus{color:#ff9d9d}
.hist-empty{color:var(--dim);font-size:14px;font-weight:700}
.undo{margin-bottom:10px;width:100%}

/* ---------- модалка траты ---------- */
.overlay{position:fixed;inset:0;background:rgba(5,6,20,.65);backdrop-filter:blur(4px);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{
  width:100%;max-width:560px;background:#1c1a42;border-radius:28px 28px 0 0;
  padding:22px 18px calc(24px + env(safe-area-inset-bottom));
  border-top:1.5px solid var(--line);
}
.sheet h3{margin:0 0 14px;font-size:19px;font-weight:900;text-align:center}
.spendbtn{
  font-family:inherit;display:flex;align-items:center;gap:11px;width:100%;
  background:var(--card);border:1.5px solid var(--line);color:var(--ink);
  border-radius:18px;padding:14px 16px;margin-bottom:9px;font-size:17px;font-weight:800;cursor:pointer;
}
.spendbtn:disabled{opacity:.35}
.spendbtn .sp-cost{margin-left:auto;color:var(--gold-hi);font-weight:900}
.customspend{display:flex;gap:8px;margin:4px 0 10px}
.customspend input{flex:1;font-family:inherit;background:var(--card);border:1.5px solid var(--line);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:16px;font-weight:700}
.customspend .btn{flex:0 0 auto;padding:12px 22px}

@media (min-width:480px){ .pad{grid-template-columns:repeat(3,84px)} }
</style>
</head>
<body>
<div id="bgstars"></div>
<div id="app"><div class="boot"><div class="star-big">⭐</div><div class="note" id="bootNote"></div></div></div>
<div id="fx"></div>

<script src="config.js"></script>
<script type="module">
/* =====================================================================
   ЗВЁЗДОЧКИ. index.html + config.js, без сборки.

   Общий стейт (дети, награды, журнал, заявки, PIN) лежит в Firebase
   Realtime Database под rooms/<room> и приходит на все телефоны живой
   подпиской (onValue → applyRemoteState). Каждое действие пишет только
   свой кусочек (журнал — отдельными записями, заявка — по ключу ребёнка),
   поэтому телефоны не затирают друг друга, а отложенные офлайн-записи
   безопасно доезжают позже.

   Локально на телефоне хранятся только:
     star-device — режим телефона (общий / чей) и lastSeen для анимации;
     star-cache  — последний снимок общих данных, чтобы открыться без сети.

   Без config.js (firebase: null) приложение работает в локальном режиме:
   те же данные лежат в localStorage, вкладки одного браузера синхронизируются
   через событие storage — удобно для проверки.
   ===================================================================== */

const CFG = window.STAR_CONFIG || {};
const FIREBASE_VER = '12.18.0';

let shared = null;      // общие данные: дети, награды, журнал, заявки, PIN
let device = null;      // локальные: mode ('shared'|kidId), lastSeen
let backend = null;     // хранилище: firebase | local | dead
let connected = null;   // null — локальный режим, иначе есть ли связь с Firebase
let view = 'home';      // home | kid | pin | parent
let curKid = null;
let pinBuf = '', pinReturn = 'home';
let spendKid = null;
let flyBusyUntil = 0;   // пока летят звёзды, детский экран не перерисовываем

/* ---------- локальное хранилище ---------- */
function loadKey(k){
  try{ const s = localStorage.getItem(k); if (s) return JSON.parse(s); }catch(e){}
  return null;
}
function saveKey(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
const saveDevice = () => saveKey('star-device', device);

function defaultShared(){
  return {
    v: 2,
    pin: '1234',
    kids: [
      { id:'kira',  name:'Кира', emoji:'🦄', hue:335 },
      { id:'sonya', name:'Соня', emoji:'🐱', hue:192 },
    ],
    rewards: [
      { id:'r1', emoji:'🍭', name:'Вкусняшка',   cost:3 },
      { id:'r2', emoji:'🧸', name:'Игрушка',     cost:5 },
      { id:'r3', emoji:'🎢', name:'Приключение', cost:10 },
    ],
    log: [], // {key, ts, kidId, delta, rw:{emoji,name}?}
    req: {}  // kidId -> {rid, ts} — активная заявка ребёнка (одна на ребёнка)
  };
}
// Начальные данные для пустой базы (пустые log/req Firebase не хранит).
const toSeed = s => ({ v: s.v, pin: s.pin, kids: s.kids, rewards: s.rewards });

/* ---------- форма данных в базе → форма в приложении ---------- */
const asList = x => Array.isArray(x) ? x.filter(Boolean) : (x && typeof x === 'object') ? Object.values(x) : [];
function fromSnapshot(v){
  v = JSON.parse(JSON.stringify(v));
  const logObj = v.log || {};
  const log = Object.keys(logObj).filter(k => logObj[k])
    .map(k => Object.assign({ key: k }, logObj[k]))
    .sort((a, b) => (a.ts - b.ts) || (a.key < b.key ? -1 : a.key > b.key ? 1 : 0));
  return {
    v: v.v || 2,
    pin: String(v.pin || '1234'),
    kids: asList(v.kids),
    rewards: asList(v.rewards),
    log,
    req: (v.req && typeof v.req === 'object') ? v.req : {}
  };
}
// Строка для сравнения состояний независимо от порядка ключей.
function stable(v){
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if (v && typeof v === 'object'){
    return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort()
      .map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  }
  const s = JSON.stringify(v);
  return s === undefined ? 'null' : s;
}
// Применить набор «путь → значение» к обычному объекту (локальный режим).
function applyPaths(obj, paths){
  Object.keys(paths).forEach(p => {
    const parts = p.split('/');
    let cur = obj;
    for (let i = 0; i < parts.length - 1; i++){
      if (!cur[parts[i]] || typeof cur[parts[i]] !== 'object') cur[parts[i]] = {};
      cur = cur[parts[i]];
    }
    const last = parts[parts.length - 1];
    if (paths[p] === null || paths[p] === undefined) delete cur[last];
    else cur[last] = JSON.parse(JSON.stringify(paths[p]));
  });
  return obj;
}

/* ---------- хранилище: Firebase или localStorage ---------- */
async function createBackend(){
  const fbc = CFG.firebase;
  if (fbc && fbc.databaseURL && CFG.room){
    try{
      const base = 'https://www.gstatic.com/firebasejs/' + FIREBASE_VER + '/';
      const [fa, fd] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-database.js')]);
      const db = fd.getDatabase(fa.initializeApp(fbc));
      const room = fd.ref(db, 'rooms/' + CFG.room);
      connected = false;
      fd.onValue(fd.ref(db, '.info/connected'), s => { connected = !!s.val(); paintConn(); });
      return {
        kind: 'firebase',
        newKey: () => fd.push(fd.child(room, 'log')).key,
        update: paths => fd.update(room, paths),
        subscribe: cb => fd.onValue(room, s => cb(s.val()), err => {
          console.warn(err);
          showDbError('Нет доступа к базе. Проверь правила (Rules) в Firebase.');
        }),
        seed: data => fd.runTransaction(room, cur => cur === null ? data : undefined)
      };
    }catch(e){
      // Firebase настроен, но SDK не загрузился (нет сети). Показываем кэш, писать нельзя.
      console.warn('Firebase не загрузился', e);
      connected = false;
      return {
        kind: 'dead',
        newKey: () => 'x' + Date.now().toString(36),
        update: () => Promise.reject(new Error('offline')),
        subscribe: () => {},
        seed: () => Promise.resolve()
      };
    }
  }
  // Локальный режим: те же данные в localStorage, вкладки синхронизируются через storage.
  const KEY = 'star-room-local';
  let data = loadKey(KEY);
  const subs = [];
  const emit = () => subs.forEach(cb => cb(data));
  const commit = () => { saveKey(KEY, data); emit(); return Promise.resolve(); };
  window.addEventListener('storage', e => {
    if (e.key !== KEY) return;
    data = e.newValue ? JSON.parse(e.newValue) : null;
    emit();
  });
  return {
    kind: 'local',
    newKey: () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
    update: paths => { data = applyPaths(data || {}, paths); return commit(); },
    subscribe: cb => { subs.push(cb); cb(data); },
    seed: d => { if (data !== null) return Promise.resolve(); data = JSON.parse(JSON.stringify(d)); return commit(); }
  };
}

/* ---------- запись в базу (каждое действие пишет только своё) ---------- */
function dbWrite(paths){
  return Promise.resolve().then(() => backend.update(paths)).catch(e => {
    console.warn('Запись не прошла', e);
    toast('Не сохранилось — нет связи 😕');
    if (backend.kind === 'dead'){ const c = loadKey('star-cache'); if (c){ shared = c; render(true); } }
  });
}
function addLog(kidId, delta, rw, clearReq){
  const key = backend.newKey();
  const rec = { ts: Date.now(), kidId: kidId, delta: delta };
  if (rw) rec.rw = { emoji: rw.emoji, name: rw.name };
  shared.log.push(Object.assign({ key: key }, rec));
  const paths = {}; paths['log/' + key] = rec;
  if (clearReq){ delete shared.req[kidId]; paths['req/' + kidId] = null; }
  return dbWrite(paths);
}
function removeLastLog(){
  const l = shared.log.pop();
  if (!l) return;
  const paths = {}; paths['log/' + l.key] = null;
  return dbWrite(paths);
}
function setReq(kidId, rq){
  if (rq) shared.req[kidId] = rq; else delete shared.req[kidId];
  const paths = {}; paths['req/' + kidId] = rq || null;
  return dbWrite(paths);
}
function saveRewards(){
  return dbWrite({ rewards: shared.rewards.map(r => ({ id: r.id, emoji: r.emoji, name: r.name, cost: r.cost })) });
}
function savePin(){ return dbWrite({ pin: shared.pin }); }

/* ---------- приём состояния из базы ---------- */
function applyRemoteState(next){
  if (!shared){
    shared = next;
    saveKey('star-cache', next);
    if (device.mode !== 'shared' && kidById(device.mode)){ curKid = device.mode; view = 'kid'; }
    render();
    return;
  }
  if (stable(next) === stable(shared)) return;   // эхо своей же записи — ничего не делаем
  const prev = shared;
  shared = next;
  saveKey('star-cache', next);
  reactToRemote(prev, next);
  scheduleRender();
}
function reactToRemote(prev, next){
  // у родителя: пришла новая заявка
  if (view === 'parent' || view === 'home'){
    Object.keys(next.req).forEach(kidId => {
      const nr = next.req[kidId], pr = prev.req[kidId];
      if (!nr || (pr && pr.ts === nr.ts && pr.rid === nr.rid)) return;
      const kd = kidById(kidId), r = next.rewards.find(x => x.id === nr.rid);
      if (kd && r){
        toast('💌 ' + kd.name + ' просит ' + r.emoji + ' ' + r.name);
        tone(784, 0, .18, .08); tone(1046, .14, .25, .08);
      }
    });
  }
  // у ребёнка: заявку одобрили
  if (view === 'kid' && curKid && prev.req[curKid] && !next.req[curKid]){
    const seen = new Set(prev.log.map(l => l.key));
    const got = next.log.find(l => !seen.has(l.key) && l.kidId === curKid && l.delta < 0 && l.rw);
    if (got) setTimeout(() => {
      toast('Ура! ' + got.rw.emoji + ' ' + got.rw.name + ' — твоя! 🎉');
      fanfare(); confettiRain(24);
    }, 400);
  }
}
let renderTimer = null, renderPending = false;
function scheduleRender(){
  if (view === 'pin') return;                      // на экране PIN от общих данных ничего не зависит
  const ae = document.activeElement;
  if (ae && app.contains(ae) && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')){
    renderPending = true;                          // родитель печатает — дорисуем, когда уберёт фокус
    return;
  }
  const wait = view === 'kid' ? Math.max(0, flyBusyUntil - Date.now()) : 0;
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => render(true), wait);
}
function showDbError(msg){

function paintConn(){

/* ---------- данные ---------- */
const kidById = id => shared.kids.find(k => k.id === id);
const balance = id => shared.log.filter(l => l.kidId === id).reduce((a,l)=>a+l.delta, 0);
const totalEarned = id => shared.log.filter(l => l.kidId === id && l.delta > 0).reduce((a,l)=>a+l.delta, 0);
function cleanupRequests(){
  Object.keys(shared.req).forEach(kidId => {
    const rq = shared.req[kidId];
    const r = rq && shared.rewards.find(x => x.id === rq.rid);
    if (!r || !kidById(kidId) || balance(kidId) < r.cost) setReq(kidId, null);
  });
}
function plural(n){
  const m = n % 10, h = n % 100;
  if (m === 1 && h !== 11) return 'звезда';
  if (m >= 2 && m <= 4 && (h < 12 || h > 14)) return 'звезды';
  return 'звёзд';
}
function fmtTs(ts){
  const d = new Date(ts), now = new Date();
  const same = (a,b) => a.toDateString() === b.toDateString();
  const y = new Date(now); y.setDate(now.getDate() - 1);
  const t = d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
  if (same(d, now)) return 'сегодня ' + t;
  if (same(d, y)) return 'вчера ' + t;
  return d.toLocaleDateString('ru-RU', {day:'numeric', month:'short'}) + ' ' + t;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- звук ---------- */
let AC = null;
function ac(){
  if (!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, when = 0, dur = .22, vol = .12, type = 'triangle'){
  const a = ac(); if (!a) return;
  const t = a.currentTime + when;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + .02);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
const PENTA = [523.25, 587.33, 659.25, 783.99, 880];
function chime(){
  const f = PENTA[Math.floor(Math.random() * PENTA.length)];
  tone(f, 0, .28, .11, 'triangle'); tone(f * 2, 0, .18, .04, 'sine');
}
function fanfare(){
  [523.25, 659.25, 783.99].forEach((f,i)=>tone(f, i*.1, .3, .11));
  tone(1046.5, .32, .55, .12);
}
function giggle(){ tone(660,0,.09,.09,'square'); tone(880,.1,.09,.09,'square'); tone(1174,.2,.14,.09,'square'); }
function thud(){ tone(196,0,.18,.08,'sine'); }
document.addEventListener('pointerdown', () => { ac(); }, { once:true });

/* ---------- эффекты ---------- */
function confettiRain(n){
  const fx = document.getElementById('fx');
  const EMO = ['⭐','✨','🎉','💛','🌟'];
  for (let i = 0; i < n; i++){
    const s = document.createElement('span');
    s.textContent = EMO[Math.floor(Math.random()*EMO.length)];
    s.style.cssText = 'position:absolute;top:-6%;left:' + (Math.random()*100) + '%;font-size:' + (14+Math.random()*16) + 'px;';
    fx.appendChild(s);
    s.animate(
      [{ transform:'translateY(0) rotate(0deg)', opacity:1 },
       { transform:'translateY(112vh) rotate(' + (Math.random()>.5?'':'-') + (200+Math.random()*300) + 'deg)', opacity:.85 }],
      { duration:1500 + Math.random()*1300, delay:Math.random()*450, easing:'cubic-bezier(.3,.1,.6,1)' }
    ).onfinish = () => s.remove();
  }
}
function sparkleAt(container, x, y){
  for (let i = 0; i < 6; i++){
    const s = document.createElement('span');
    s.textContent = '✨';
    s.style.cssText = 'position:absolute;left:' + x + 'px;top:' + y + 'px;font-size:13px;pointer-events:none;transform:translate(-50%,-50%);';
    container.appendChild(s);
    const a = Math.random() * Math.PI * 2, d = 26 + Math.random()*26;
    s.animate(
      [{ transform:'translate(-50%,-50%) scale(1)', opacity:1 },
       { transform:'translate(calc(-50% + ' + (Math.cos(a)*d) + 'px), calc(-50% + ' + (Math.sin(a)*d) + 'px)) scale(.3)', opacity:0 }],
      { duration:480 + Math.random()*200, easing:'ease-out' }
    ).onfinish = () => s.remove();
  }
}
function shootingStar(container, x, y){
  const s = document.createElement('span');
  s.textContent = '✨';
  s.style.cssText = 'position:absolute;left:' + x + 'px;top:' + y + 'px;font-size:16px;pointer-events:none;transform:translate(-50%,-50%);';
  container.appendChild(s);
  const dx = (Math.random() > .5 ? 1 : -1) * (90 + Math.random()*70);
  s.animate(
    [{ transform:'translate(-50%,-50%)', opacity:1 },
     { transform:'translate(calc(-50% + ' + dx + 'px), calc(-50% - ' + (50+Math.random()*40) + 'px)) scale(.4)', opacity:0 }],
    { duration:650, easing:'ease-out' }
  ).onfinish = () => s.remove();
  tone(1318, 0, .2, .05, 'sine');
}
let toastT = null;
function toast(msg){
  let el = document.querySelector('.toast');
  if (!el){ el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  requestAnimationFrame(()=>el.classList.add('show'));
  clearTimeout(toastT);
  toastT = setTimeout(()=>el.classList.remove('show'), 2200);
}

/* ---------- позиции звёзд на небе ---------- */
function starPos(i){
  const a = i * 2.39996 + (i % 2 ? .4 : 0);
  const r = Math.min(1, Math.sqrt(i + .6) / Math.sqrt(24));
  const jx = ((i * 2654435761 % 97) / 97 - .5) * 7;
  const jy = ((i * 40503 % 89) / 89 - .5) * 7;
  return {
    x: Math.max(9, Math.min(91, 50 + Math.cos(a) * r * 40 + jx)),
    y: Math.max(11, Math.min(89, 50 + Math.sin(a) * r * 36 + jy))
  };
}
function makeStarEl(i){
  const s = document.createElement('span');
  s.className = 'star';
  s.textContent = '⭐';
  const p = starPos(i);
  s.style.left = p.x + '%';
  s.style.top = p.y + '%';
  s.style.fontSize = (34 + (i * 7919 % 5) * 4) + 'px';
  s.style.animationDelay = (-(i * 137 % 40) / 10) + 's, ' + (-(i * 271 % 32) / 10) + 's';
  return s;
}

/* --- детский экран --- */
function renderKid(){
  const kid = kidById(curKid);
  const b = balance(curKid);
  const total = totalEarned(curKid);
  const seen = (device.lastSeen && device.lastSeen[curKid]) || 0;
  const pending = b > seen;               // прилетели новые звёзды
  const shown = pending ? Math.min(seen, b) : b;

  const miniMax = 40;
  const miniHtml = total === 0
    ? '<span class="c-empty">пока пусто — всё впереди!</span>'
    : Array.from({length: Math.min(total, miniMax)}, () => '<span class="mini">✦</span>').join('') +
      (total > miniMax ? '<span class="more">+' + (total - miniMax) + '</span>' : '');

  app.innerHTML =
    '<div class="screen">' +
      '<div class="kidhead">' +
        '<span></span>' +
        '<div class="kidtitle">' +
          '<button class="avatar" id="avBtn">' + kid.emoji + '</button>' +
          '<span class="kidname">' + esc(kid.name) + '</span>' +
        '</div><span></span>' +
      '</div>' +
      '<div class="constellation">' +
        '<div class="c-label">Моё созвездие — всего собрано: ' + total + '</div>' +
        '<div class="c-stars">' + miniHtml + '</div>' +
      '</div>' +
      '<div class="balline">У тебя <b id="balNum">' + shown + '</b> <span id="balWord">' + plural(shown) + '</span></div>' +
      '<div id="sky">' +
        (b === 0 ? '<div class="sky-empty"><span class="moon">🌙</span>Небо ждёт твоих звёздочек!</div>' : '') +
      '</div>' +
      '<div class="shelfhead">На что можно потратить</div>' +
      '<div class="shelf">' +
        shared.rewards.map(r => {
          const can = b >= r.cost;
          const isReq = shared.req[curKid] && shared.req[curKid].rid === r.id;
          const filled = Math.min(b, r.cost);
          const slots = r.cost <= 12
            ? Array.from({length: r.cost}, (_, i) => '<span class="slot' + (i < filled ? ' on' : '') + '">★</span>').join('')
            : '<span class="cost-big">' + filled + ' / ' + r.cost + ' ★</span>';
          return '<div class="rw' + (can ? ' can' : '') + (isReq ? ' req' : '') + '" data-cost="' + r.cost + '" data-rid="' + r.id + '">' +
            '<div class="rw-em">' + esc(r.emoji) + '</div>' +
            '<div class="rw-body"><div class="rw-nm">' + esc(r.name) + '</div><div class="rw-slots">' + slots + '</div></div>' +
            '<div class="rw-tag">' + (isReq ? 'Попросила! 💌' : can ? 'Можно! 🎉' : 'ещё ' + (r.cost - b) + ' ⭐') + '</div>' +
          '</div>';
        }).join('') +
      '</div>' +
    '</div>';

  const sky = document.getElementById('sky');
  for (let i = 0; i < shown; i++) sky.appendChild(makeStarEl(i));

  // тапы по небу и звёздам
  sky.addEventListener('pointerdown', e => {
    const st = e.target.closest('.star');
    const r = sky.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    if (st){
      st.classList.remove('pop'); void st.offsetWidth; st.classList.add('pop');
      sparkleAt(sky, x, y); chime();
    } else if (e.target === sky){
      shootingStar(sky, x, y);
    }
  });

  // награды: тап по доступной — заявка папе, повторный тап — отмена, тап по другой — смена
  function refreshCards(){
    const myReq = shared.req[curKid];
    app.querySelectorAll('.rw').forEach(el => {
      const cost = +el.dataset.cost;
      const isReq = myReq && myReq.rid === el.dataset.rid;
      el.classList.toggle('req', !!isReq);
      el.querySelector('.rw-tag').textContent =
        isReq ? 'Попросила! 💌' : (b >= cost ? 'Можно! 🎉' : 'ещё ' + (cost - b) + ' ⭐');
    });
  }
  app.querySelectorAll('.rw').forEach(el => {
    el.onclick = () => {
      const rid = el.dataset.rid;
      const myReq = shared.req[curKid];
      if (myReq && myReq.rid === rid){
        setReq(curKid, null);
        tone(494, 0, .14, .08); tone(392, .12, .2, .08);
        toast('Передумала 😊');
        refreshCards();
      } else if (el.classList.contains('can')){
        const switching = !!myReq;
        setReq(curKid, { rid: rid, ts: Date.now() });
        fanfare(); confettiRain(14);
        toast(switching ? 'Теперь хочу это! ✨' : 'Попросила у папы! 💌');
        refreshCards();

        el.classList.remove('wig'); void el.offsetWidth; el.classList.add('wig'); thud();

  // аватар: тап — смешно, удержание 1.5 с — родительский код
  const av = document.getElementById('avBtn');

  av.addEventListener('pointerdown', () => {
    held = false;
    holdT = setTimeout(() => { held = true; openPin('kid'); }, 1500);
  });
  ['pointerleave','pointercancel'].forEach(ev => av.addEventListener(ev, () => clearTimeout(holdT)));
  av.addEventListener('pointerup', () => {
    clearTimeout(holdT);
    if (!held){ av.classList.remove('wob'); void av.offsetWidth; av.classList.add('wob'); giggle(); }
  });

  // празднование новых звёзд
  device.lastSeen = device.lastSeen || {};
  device.lastSeen[curKid] = b;
  saveDevice();
  if (pending){
    flyBusyUntil = Date.now() + 500 + Math.min(b - seen, 14) * 520 + 1100;
    setTimeout(() => flyIn(seen, b - seen, b), 500);
  }
}

function flyIn(startIdx, n, finalB){
  const sky = document.getElementById('sky');
  if (!sky) return;
  const empty = sky.querySelector('.sky-empty');
  if (empty) empty.remove();
  fanfare();
  confettiRain(20);
  const cap = Math.min(n, 14);
  const num = document.getElementById('balNum');
  const word = document.getElementById('balWord');
  for (let i = 0; i < cap; i++){
    setTimeout(() => {
      const idx = startIdx + i;
      const s = makeStarEl(idx);
      sky.appendChild(s);
      const r = sky.getBoundingClientRect();
      const p = starPos(idx);
      const tx = r.width * p.x / 100, ty = r.height * p.y / 100;
      s.animate(
        [{ transform:'translate(calc(-50% + ' + (r.width/2 - tx) + 'px), calc(-50% + ' + (-40 - ty) + 'px)) scale(.2)', opacity:0 },
         { transform:'translate(-50%,-50%) scale(1.35)', opacity:1, offset:.8 },
         { transform:'translate(-50%,-50%) scale(1)' }],
        { duration:680, easing:'cubic-bezier(.2,.7,.3,1.25)' }
      );
      chime();
      const cur = idx + 1;
      if (num){ num.textContent = cur; word.textContent = plural(cur); }
    }, i * 520);
  }
  setTimeout(() => {
    for (let i = startIdx + cap; i < startIdx + n; i++) sky.appendChild(makeStarEl(i));
    if (num){ num.textContent = finalB; word.textContent = plural(finalB); }
  }, cap * 520 + 720);
}

      (shared.pin === '1234' ? '<p class="pinhint">Код по умолчанию: 1234 — смени его в настройках</p>' : '') +
      '<div class="pad">' +
        ['1','2','3','4','5','6','7','8','9','','0','⌫'].map(kk =>
          kk === '' ? '<span></span>' : '<button class="key" data-key="' + kk + '">' + kk + '</button>').join('') +
      '</div>' +
    '</div>';
  document.getElementById('pinBack').onclick = () => { view = pinReturn; render(); };
  app.querySelectorAll('.key').forEach(btn => btn.onclick = () => {
    const kk = btn.dataset.key;
    if (kk === '⌫'){ pinBuf = pinBuf.slice(0, -1); }
    else if (pinBuf.length < 4){ pinBuf += kk; tone(700 + pinBuf.length * 90, 0, .08, .06); }
    refreshDots();
    if (pinBuf.length === 4){
      if (pinBuf === shared.pin){ view = 'parent'; pinBuf = ''; setTimeout(() => render(), 120); }
      else {
        const d = document.getElementById('dots');
        d.classList.add('shake'); thud();
        setTimeout(() => { pinBuf = ''; refreshDots(); d.classList.remove('shake'); }, 380);
      }
    }
  });
  function refreshDots(){
    document.querySelectorAll('#dots .dot').forEach((d, i) => d.classList.toggle('full', i < pinBuf.length));
  }
}

/* --- родительский --- */
function renderParent(){
  // не терять набранное в полях, если экран перерисовался из-за обновления с другого телефона
  const keep = {};
  ['newPin', 'csAmt'].forEach(id => { const el = document.getElementById(id); if (el) keep[id] = el.value; });

  app.innerHTML =
    '<div class="screen">' +
      '<div class="phead"><button class="back" id="pBack">‹</button><h2>Родительский режим</h2></div>' +
      '<div class="conn" id="connDot"></div>' +

      shared.kids.map(kd => {
        const b = balance(kd.id), t = totalEarned(kd.id);
        const rq = shared.req[kd.id];
        const rr = rq && shared.rewards.find(x => x.id === rq.rid);
        const reqHtml = rr
          ? '<div class="reqbox"><span class="reqtxt">💌 Просит: ' + esc(rr.emoji) + ' ' + esc(rr.name) + ' <b>−' + rr.cost + ' ⭐</b></span>' +
            '<div class="reqbtns"><button class="ok" data-approve="' + kd.id + '">Выдать</button><button class="no" data-decline="' + kd.id + '">✕</button></div></div>'
          : '';
        return '<div class="pk" style="--kh:' + kd.hue + '">' +
          '<div class="pk-top"><span class="em">' + kd.emoji + '</span><span class="nm">' + esc(kd.name) + '</span></div>' +
          '<div class="pk-nums">' + b + ' ⭐ <span class="sub">· всего собрано ' + t + '</span></div>' +
          reqHtml +
          '<div class="pk-btns">' +
            '<button class="btn earn" data-earn="' + kd.id + '">+1 ⭐</button>' +
            '<button class="btn spend" data-spendopen="' + kd.id + '">Потратить</button>' +
          '</div>' +
        '</div>';
      }).join('') +

      '<div class="psec"><h3>Награды</h3><div id="rwlist">' +
        shared.rewards.map((r, i) =>
          '<div class="rwrow">' +
            '<input class="i-em" data-ri="' + i + '" data-f="emoji" value="' + esc(r.emoji) + '" maxlength="4">' +
            '<input class="i-nm" data-ri="' + i + '" data-f="name" value="' + esc(r.name) + '">' +
            '<input class="i-cost" data-ri="' + i + '" data-f="cost" type="number" inputmode="numeric" min="1" value="' + r.cost + '">' +
            '<button class="icon-btn" data-del="' + i + '">✕</button>' +
          '</div>').join('') +
        '</div><button class="icon-btn addrow" id="addRw">+ добавить награду</button>' +
      '</div>' +

      '<div class="psec"><h3>Этот телефон</h3>' +
        '<div class="seg">' +
          '<button data-mode="shared" class="' + (device.mode === 'shared' ? 'on' : '') + '">Спросить</button>' +
          shared.kids.map(kd =>
            '<button data-mode="' + kd.id + '" class="' + (device.mode === kd.id ? 'on' : '') + '">' + kd.emoji + ' ' + esc(kd.name) + '</button>').join('') +
        '</div>' +
        '<div class="seg-note">Телефон открывается сразу на выбранном небе и остаётся там — кнопки «назад» у ребёнка нет. «Спросить» — при запуске появится выбор профиля, и первый тап закрепит его. В родительский режим: подержать аватар 2 секунды.</div>' +
      '</div>' +

      '<div class="psec"><h3>PIN-код</h3>' +
        '<div class="pinrow"><input id="newPin" inputmode="numeric" maxlength="4" placeholder="Новый код (4 цифры)">' +
        '<button class="btn earn" id="savePin">Сохранить</button></div>' +
      '</div>' +

      '<div class="psec"><h3>История</h3>' +
        (shared.log.length ? '<button class="icon-btn addrow undo" id="undoBtn">↩︎ Отменить последнее</button>' : '') +
        (shared.log.length
          ? shared.log.slice(-15).reverse().map(l => {
              const kd = kidById(l.kidId) || { emoji: '❔', name: '' };
              const sign = l.delta > 0
                ? '<span class="plus">+' + l.delta + ' ⭐</span>'
                : '<span class="minus">−' + (-l.delta) + ' ⭐' + (l.rw ? ' ' + esc(l.rw.emoji) : '') + '</span>';
              return '<div class="hist-item"><span>' + kd.emoji + ' ' + esc(kd.name) + ' ' + sign + '</span><span class="when">' + fmtTs(l.ts) + '</span></div>';
            }).join('')
          : '<div class="hist-empty">Пока пусто. Начисли первую звезду!</div>') +
      '</div>' +
    '</div>' +
    (spendKid ? spendSheetHtml() : '');

  Object.keys(keep).forEach(id => { const el = document.getElementById(id); if (el && keep[id]) el.value = keep[id]; });
  paintConn();

  document.getElementById('pBack').onclick = () => {
    if (device.mode !== 'shared'){ curKid = device.mode; view = 'kid'; }
    else view = 'home';
    render();
  };

  app.querySelectorAll('[data-earn]').forEach(b => b.onclick = () => {
    addLog(b.dataset.earn, 1);
    chime(); render();
  });
  app.querySelectorAll('[data-spendopen]').forEach(b => b.onclick = () => { spendKid = b.dataset.spendopen; render(); });

  app.querySelectorAll('[data-approve]').forEach(btn => btn.onclick = () => {
    const kidId = btn.dataset.approve;
    const rq = shared.req[kidId]; if (!rq) return;
    const r = shared.rewards.find(x => x.id === rq.rid);
    if (!r || balance(kidId) < r.cost){ setReq(kidId, null); toast('Не хватает звёзд'); render(); return; }
    addLog(kidId, -r.cost, r, true);
    fanfare(); confettiRain(10); render();
  });
  app.querySelectorAll('[data-decline]').forEach(btn => btn.onclick = () => {
    setReq(btn.dataset.decline, null);
    tone(392, 0, .2, .08); render();
  });

  app.querySelectorAll('#rwlist input').forEach(inp => inp.onchange = () => {
    const r = shared.rewards[+inp.dataset.ri];
    if (!r) return;
    if (inp.dataset.f === 'cost'){ r.cost = Math.max(1, parseInt(inp.value) || 1); inp.value = r.cost; }
    else r[inp.dataset.f] = inp.value;
    saveRewards();
  });
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    shared.rewards.splice(+b.dataset.del, 1); saveRewards(); render();
  });
  document.getElementById('addRw').onclick = () => {
    shared.rewards.push({ id: 'r' + Date.now(), emoji: '🎁', name: 'Награда', cost: 3 });
    saveRewards(); render();
  };

  app.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
    device.mode = b.dataset.mode; saveDevice(); render();
  });

  document.getElementById('savePin').onclick = () => {
    const v = document.getElementById('newPin').value.trim();
    if (/^\d{4}$/.test(v)){ shared.pin = v; savePin(); toast('Код сохранён ✓'); render(); }
    else toast('Нужно 4 цифры');
  };

  const undo = document.getElementById('undoBtn');
  if (undo) undo.onclick = () => { removeLastLog(); render(); };

  if (spendKid) bindSpendSheet();
}

function spendSheetHtml(){
  const kd = kidById(spendKid);
  const b = balance(spendKid);
  return '<div class="overlay" id="ovl"><div class="sheet">' +
    '<h3>' + kd.emoji + ' ' + esc(kd.name) + ' тратит звёзды (есть ' + b + ')</h3>' +
    shared.rewards.map(r =>
      '<button class="spendbtn" data-cost="' + r.cost + '" data-rid="' + r.id + '"' + (b < r.cost ? ' disabled' : '') + '>' +
        esc(r.emoji) + ' ' + esc(r.name) + '<span class="sp-cost">−' + r.cost + ' ⭐</span>' +
      '</button>').join('') +
    '<div class="customspend"><input id="csAmt" type="number" inputmode="numeric" min="1" placeholder="другое число">' +
    '<button class="btn spend" id="csBtn">−</button></div>' +
    '<button class="ghost" id="ovlClose" style="width:100%;margin-top:2px">Отмена</button>' +
  '</div></div>';
}
function bindSpendSheet(){
  const b = balance(spendKid);
  document.getElementById('ovlClose').onclick = () => { spendKid = null; render(); };
  document.getElementById('ovl').onclick = e => { if (e.target.id === 'ovl'){ spendKid = null; render(); } };
  app.querySelectorAll('.spendbtn').forEach(btn => btn.onclick = () => {
    const r = shared.rewards.find(x => x.id === btn.dataset.rid);
    doSpend(+btn.dataset.cost, r ? { emoji: r.emoji, name: r.name } : null);
  });
  document.getElementById('csBtn').onclick = () => {
    const v = parseInt(document.getElementById('csAmt').value);
    if (v >= 1 && v <= b) doSpend(v, null);
    else toast('Не хватает звёзд');
  };
}
function doSpend(cost, rw){
  addLog(spendKid, -cost, rw || null);
  spendKid = null;
  tone(392, 0, .25, .1); tone(523, .12, .3, .1);
  render();
}

/* ---------- фон и запуск ---------- */
function paintBgStars(){
  const bg = document.getElementById('bgstars');
  const W = innerWidth, H = innerHeight;
  for (let i = 0; i < 55; i++){
    const s = document.createElement('i');
    s.style.left = Math.random() * W + 'px';
    s.style.top = Math.random() * H + 'px';
    s.style.animationDelay = (Math.random() * 4) + 's';
    if (Math.random() > .8) s.style.width = s.style.height = '3px';
    bg.appendChild(s);
  }
}

async function boot(){
  paintBgStars();
  device = loadKey('star-device') || { mode: 'shared', lastSeen: {} };
  device.lastSeen = device.lastSeen || {};
  backend = await createBackend();

  // Если сервер долго не отвечает — показываем последний снимок из кэша.
  const cached = loadKey('star-cache');
  setTimeout(() => {
    if (shared) return;
    if (cached) applyRemoteState(cached);
    else bootNote(backend.kind === 'dead' ? 'Нет связи с сервером' : 'Ждём связь с сервером…', backend.kind === 'dead');
  }, backend.kind === 'dead' ? 0 : 3000);

  let seeded = false;
  backend.subscribe(val => {
    if (val === null){
      // Пустая база: первый телефон создаёт начальные данные (транзакция — чтобы не создать дважды).
      if (!seeded){
        seeded = true;
        backend.seed(toSeed(defaultShared())).catch(e => {
          console.warn(e);
          showDbError('Не удалось записать в базу. Проверь правила (Rules) в Firebase.');
        });
      } else {
        showDbError('База пустая, а запись запрещена. Проверь правила (Rules) в Firebase.');
      }
      return;
    }
    applyRemoteState(fromSnapshot(val));
  });
}
boot();
</script>
